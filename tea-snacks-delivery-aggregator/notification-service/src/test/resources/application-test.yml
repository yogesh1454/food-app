server:
  port: 0  # Random port for testing

spring:
  application:
    name: notification-service-test
  
  # In-memory database for testing
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  # Disable Kafka for testing
  kafka:
    bootstrap-servers: localhost:9999  # Non-existent server
    consumer:
      enable-auto-commit: false
    producer:
      retries: 0

# Notification service test configuration
notification:
  email:
    provider: sendgrid
    from-email: test@example.com
    from-name: Test Service
    sendgrid:
      api-key: test-api-key
      
  sms:
    provider: gupshup
    gupshup:
      api-key: test-api-key
      sender-id: TEST
      base-url: https://api.gupshup.io/sm/api/v1
      
  rate-limit:
    enabled: false  # Disable rate limiting for tests
    email:
      per-minute: 1000
      per-hour: 10000
    sms:
      per-minute: 100
      per-hour: 1000
      
  async:
    enabled: true
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 10
    
  templates:
    base-path: classpath:/templates/notifications
    email-path: email
    sms-path: sms

# Logging configuration for tests
logging:
  level:
    com.teadelivery.notification: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
