server:
  port: 8084

spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/tea_snacks_db
    username: tea_snacks_user
    password: tea_snacks_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  kafka:
    bootstrap-servers: localhost:9092
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:test_password}

# Notification Service Configuration
notification:
  email:
    provider: sendgrid
    api-key: ${SENDGRID_API_KEY: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}
    from-email: ${NOTIFICATION_FROM_EMAIL:foodapp1454@gmail.com}
    from-name: ${NOTIFICATION_FROM_NAME:Tea & Snacks}
    max-retries: 3
    retry-delay: 5000
    rate-limit:
      max: 100
      per: minute
      
  sms:
    provider: gupshup
    api-key: ${GUPSHUP_API_KEY:your_gupshup_api_key}
    sender-id: ${GUPSHUP_SENDER_ID:TEASNK}
    base-url: ${GUPSHUP_BASE_URL:https://api.gupshup.io/sm/api/v1}
    max-retries: 3
    retry-delay: 5000
    rate-limit:
      max: 50
      per: minute

  async:
    thread-pool-size: 5
    queue-capacity: 100
    thread-name-prefix: notification-
    
  templates:
    location: classpath:/templates/notifications/
    email-path: email/
    sms-path: sms/
    
  # Local development URLs
  local:
    base-url: ${LOCAL_BASE_URL:http://localhost:8082}
    verification-path: ${VERIFICATION_PATH:/verify}
    reset-password-path: ${RESET_PASSWORD_PATH:/reset-password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,mail
        liveness:
          include: ping

logging:
  level:
    com.teadelivery: INFO
