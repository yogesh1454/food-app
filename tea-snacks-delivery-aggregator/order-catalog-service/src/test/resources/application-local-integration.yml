spring:
  application:
    name: order-catalog-service-local-integration
  
  # Connect to local Docker containers
  datasource:
    url: jdbc:postgresql://localhost:5432/order_catalog_db
    username: tea_snacks_user
    password: tea_snacks_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # Validate schema matches entities
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Don't clean in tests - we use @Transactional rollback instead
    clean-disabled: true
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: test-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Shorter timeouts for tests
order:
  timeout:
    restaurant-acceptance: 5s
    payment-processing: 10s
    rider-assignment: 10s

logging:
  level:
    com.teadelivery: DEBUG
    org.springframework.test: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Disable health checks for tests
management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

