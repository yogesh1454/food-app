plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

allprojects {
    group = 'com.teadelivery'
    version = '0.0.1-SNAPSHOT'
    
    repositories {
        mavenCentral()
    }
}

// Root project configuration only
// Individual services now have their own build.gradle files with specific dependencies

// Disable the root project jar task
jar.enabled = false
bootJar.enabled = false
